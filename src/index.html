<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Notas</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFA0A0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-frame">
  <header class="app-header">
    <h1 class="app-header__title">Notas</h1>
    <div class="app-header__actions">
      <button id="btn-home" class="icon-btn" aria-label="Ir a la semana actual" title="Semana actual">🏠</button>
      <button id="btn-add" class="icon-btn icon-btn--primary" aria-label="Agregar tarea" title="Agregar tarea">+</button>
    </div>
  </header>

  <main id="week-list" class="week-list">
    <p class="state-msg">Cargando tus tareas…</p>
  </main>
</div>

<div id="toast" class="toast"></div>

<!-- Modal lateral: se abre de derecha a izquierda (entra desde fuera
     de la pantalla) y queda pegado al 80% derecho de la pantalla (20%
     izquierdo queda visible, 10% de margen arriba y abajo). Sirve
     tanto para crear como para editar. -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div id="task-modal" class="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="task-modal__header">
      <h2 id="modal-title">Nueva tarea</h2>
      <button id="modal-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
    </div>

    <div class="task-modal__body">
      <p id="modal-selected-date" class="task-modal__meta"></p>

      <label class="field">
        <span class="field__label">Nombre</span>
        <input id="field-name" type="text" placeholder="Ej. Estudiar inglés" />
      </label>

      <label class="field">
        <span class="field__label">Fecha de inicio</span>
        <input id="field-fecha-inicio" type="date" />
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field__label">Frecuencia (días)</span>
          <input id="field-frecuencia" type="number" min="1" step="1" placeholder="2" />
        </label>
        <label class="field">
          <span class="field__label">Máximo de retraso</span>
          <input id="field-max-retraso" type="number" min="0" step="1" placeholder="4" />
        </label>
      </div>

      <label class="field field--credito">
        <span class="field__label">Crédito (1 a 5)</span>
        <input id="field-valor" type="number" min="1" max="5" step="1" />
      </label>

      <fieldset class="rules-fieldset">
        <legend>Reglas</legend>

        <label class="rule-check">
          <input type="checkbox" id="rule-finde" data-group="finde" value="contar_fin_semana" />
          Contar los fines de semana
        </label>
        <label class="rule-check">
          <input type="checkbox" id="rule-un-dia-finde" data-group="finde" value="contar_un_dia_fin_semana" />
          Contar solo un día del fin de semana
        </label>
        <label class="rule-check">
          <input type="checkbox" id="rule-prioridad-alta" data-group="prioridad" value="prioridad_alta" />
          Prioridad alta
        </label>
        <label class="rule-check">
          <input type="checkbox" id="rule-prioridad-media" data-group="prioridad" value="prioridad_media" />
          Prioridad media
        </label>
      </fieldset>

      <p id="modal-error" class="modal-error" hidden></p>
    </div>

    <div class="task-modal__footer">
      <button id="btn-delete" class="btn btn--ghost" type="button" hidden>Eliminar</button>
      <button id="btn-save" class="btn btn--primary" type="button">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal informativo de felicitación (2s) al marcar una tarea como
     hecha. Mismo patrón lateral que el resto de modales. -->
<div id="congrats-overlay" class="modal-overlay" hidden>
  <div class="info-modal" role="status" aria-live="polite">
    <span class="info-modal__icon">🎉</span>
    <p id="congrats-text" class="info-modal__text"></p>
  </div>
</div>

<!-- Modal de selección cuando un día supera los créditos disponibles.
     Usa la variante compacta: el alto se ajusta a la cantidad de
     tareas en vez de quedar fijo. -->
<div id="overflow-overlay" class="modal-overlay" hidden>
  <div id="overflow-modal" class="task-modal task-modal--compact" role="dialog" aria-modal="true">
    <div class="task-modal__header">
      <h2>Créditos del día</h2>
      <button id="overflow-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="task-modal__body">
      <p id="overflow-date" class="task-modal__meta"></p>
      <div id="overflow-list" class="overflow-list"></div>
    </div>
    <div class="task-modal__footer">
      <button id="overflow-confirm" class="btn btn--primary" type="button">Hacer esto hoy</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/rules.js"></script>
<script src="js/app.js"></script>
<script src="js/task-modal.js"></script>
<script src="js/congrats-modal.js"></script>
<script src="js/overflow-modal.js"></script>
<script src="js/drag.js"></script>
</body>
</html>
